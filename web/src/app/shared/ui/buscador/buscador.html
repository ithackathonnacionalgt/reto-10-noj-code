<form class="barra" (ngSubmit)="enviar()" role="search">
  <!-- Destello del modo IA que recorre el contorno. Dos copias de la misma
       chispa, sincronizadas: una recortada al aro (el trazo nítido) y otra
       desenfocada detrás de la barra (la luz que irradia). -->
  <span class="contorno" aria-hidden="true"><span class="chispa"></span></span>
  <span class="contorno-halo" aria-hidden="true">
    <span class="aro-halo"><span class="chispa"></span></span>
  </span>
  <!-- Onda que sale una vez al encender el modo IA. -->
  <span class="onda" aria-hidden="true"></span>

  <label class="sr-only" [attr.for]="id">{{ etiqueta() }}</label>

  <!-- SVG en vez de emoji: se tiñe con el tema y no cambia según el SO. -->
  <span class="icono" aria-hidden="true">
    @if (modoIa()) {
      <svg viewBox="0 0 24 24">
        <defs>
          <linearGradient [attr.id]="id + '-degradado'" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" class="parada-1" />
            <stop offset="60%" class="parada-2" />
            <stop offset="100%" class="parada-3" />
          </linearGradient>
        </defs>
        <g [attr.fill]="'url(#' + id + '-degradado)'">
          <path d="M11 2.5c.55 4.3 2.7 6.45 7 7-4.3.55-6.45 2.7-7 7-.55-4.3-2.7-6.45-7-7 4.3-.55 6.45-2.7 7-7Z" />
          <path d="M18.5 14c.3 1.95 1.25 2.9 3.2 3.2-1.95.3-2.9 1.25-3.2 3.2-.3-1.95-1.25-2.9-3.2-3.2 1.95-.3 2.9-1.25 3.2-3.2Z" />
        </g>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
    }
  </span>

  <input
    #campo
    [id]="id"
    name="q"
    type="search"
    autocomplete="off"
    enterkeyhint="search"
    [placeholder]="dictado.escuchando() ? 'Te escucho…' : modoIa() ? marcadorIa() : marcador()"
    [ngModel]="texto()"
    (ngModelChange)="texto.set($event)"
  />

  <div class="acciones">
    @if (texto() && !dictado.escuchando()) {
      <button type="button" class="boton-icono" aria-label="Limpiar búsqueda" (click)="limpiar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" aria-hidden="true">
          <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
        </svg>
      </button>
    }

    @if (dictado.soportado) {
      <button
        type="button"
        class="boton-icono microfono"
        [class.activo]="dictado.escuchando()"
        [attr.aria-pressed]="dictado.escuchando()"
        [attr.aria-label]="dictado.escuchando() ? 'Detener dictado' : 'Dictar por voz'"
        [attr.title]="dictado.escuchando() ? 'Detener dictado' : 'Dictar por voz'"
        (click)="alternarDictado()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11.5" rx="3" />
          <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" />
        </svg>
      </button>
    }

    <span class="separador" aria-hidden="true"></span>

    <!-- Interruptor de verdad (role="switch"): el lector de pantalla anuncia
         «Modo IA, activado / desactivado», no un botón genérico. -->
    <button
      type="button"
      role="switch"
      class="interruptor"
      [attr.aria-checked]="modoIa()"
      title="La IA interpreta tu pregunta y te muestra los trámites que mejor encajan"
      (click)="alternarIa()"
    >
      <span class="pista" aria-hidden="true">
        <span class="perilla"></span>
      </span>
      <span class="rotulo">Modo IA</span>
    </button>

    <button
      type="submit"
      class="enviar"
      [attr.aria-label]="modoIa() ? 'Preguntar a la IA' : 'Buscar'"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </button>
  </div>
</form>

@if (dictado.error(); as error) {
  <p class="aviso-voz" role="status">{{ error }}</p>
}
