<header class="cabecera">
  <div class="contenedor interna">
    <div class="izquierda">
      @if (enTramite()) {
        <button type="button" class="icono" (click)="volver()" aria-label="Volver al listado" title="Volver al listado">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 5-7 7 7 7M5 12h14" />
          </svg>
        </button>
      }

      <!-- Marca: logo y nombre, y de paso el camino de vuelta al inicio. -->
      <a class="marca" routerLink="/" aria-label="No’j, ir al inicio">
        <!-- Glifo del nawal No’j: el cartucho del signo de día con el ojo y el
             oído, sobre su pedestal. Versión de 128 px (el original pesa
             854 KB); `alt` vacío porque el nombre accesible lo da el enlace. -->
        <img class="logo" src="/marca/logo-noj-128.png" width="128" height="128" alt="" decoding="async" />
        <!-- No’j: el saltillo (oclusiva glotal) va después de la o. -->
        <span class="nombre">No<span class="apostrofe">’</span>j</span>
      </a>
    </div>

    <div class="herramientas">
      <app-panel-accesibilidad />

      <button
        type="button"
        class="icono"
        [attr.aria-label]="etiquetaTema()"
        [attr.title]="etiquetaTema()"
        [attr.aria-pressed]="esOscuro()"
        (click)="tema.alternar()"
      >
        @if (esOscuro()) {
          <!-- Sol: la acción es volver al modo claro -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />
          </svg>
        } @else {
          <!-- Luna: la acción es pasar al modo oscuro -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a6.8 6.8 0 0 0 9.5 9.5Z" />
          </svg>
        }
      </button>
      <a class="icono" routerLink="/desarrolladores" aria-label="Documentación para desarrolladores" title="Documentación del API">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m7 7-5 5 5 5m10-10 5 5-5 5m-3-14-4 18" />
        </svg>
      </a>
    </div>
  </div>
</header>
